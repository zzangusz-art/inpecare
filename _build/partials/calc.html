<div class="calc">
  <form class="calc__panel" id="calc" onsubmit="return false" aria-label="소파 · 매트리스 청소 견적 계산기">
    <div class="calc__group">
      <span class="calc__label">품목 <small>매트리스·소파를 여러 개 담을 수 있어요</small></span>
      <div class="citems" id="calc-items" aria-live="polite"></div>
      <div class="citems__add">
        <button class="btn btn--ghost btn--sm" type="button" data-add="mattress">+ 매트리스 추가</button>
        <button class="btn btn--ghost btn--sm" type="button" data-add="sofa">+ 소파 추가</button>
      </div>
      <p class="calc__fine">UV 살균·고성능 흡입·얼룩 제거·탈취 포함. 소파는 패브릭 기준이며 카우치형은 1만원이 추가됩니다.</p>
    </div>
    <div class="calc__group">
      <span class="calc__label">케어 방식 <small>반려동물 오염은 습건식 + 스팀 권장</small></span>
      <div class="seg">
        <input type="radio" name="method" id="cm-dry" value="dry"><label for="cm-dry">건식 (바로 사용)</label>
        <input type="radio" name="method" id="cm-wet" value="wet" checked><label for="cm-wet">습건식 + 스팀 (3~5시간 건조)</label>
      </div>
    </div>
    <div class="calc__group">
      <span class="calc__label">반려동물 상황</span>
      <label class="toggle"><input type="checkbox" name="pet_urine"><span class="toggle__txt">소변 · 배변 · 구토 오염이 있어요<small>습건식 + 스팀으로 진행합니다</small></span><span class="toggle__sw" aria-hidden="true"></span></label>
      <label class="toggle"><input type="checkbox" name="pet_hair"><span class="toggle__txt">털 · 비듬 · 체취가 신경 쓰여요<small>고성능 흡입 + 음이온 탈취 마감 (추가 비용 없음)</small></span><span class="toggle__sw" aria-hidden="true"></span></label>
      <label class="toggle"><input type="checkbox" name="pet_virus"><span class="toggle__txt">파보 · 칼리시 감염 이력이 있어요<small>반려동물 바이러스 방역 149,000원~ (10평 기준, 평형별 차등)</small></span><span class="toggle__sw" aria-hidden="true"></span></label>
    </div>
  </form>
  <aside class="calc__result" aria-live="polite">
    <span class="eyebrow">예상 금액</span>
    <p class="calc__total"><b class="num" id="calc-total">0</b><span>원</span></p>
    <ul class="calc__lines" id="calc-lines"></ul>
    <p class="calc__hint" id="calc-hint" hidden><svg class="ico"><use href="#i-paw"/></svg><span>오염 상태에 따라 공정이 달라질 수 있습니다. 신청할 때 사진을 함께 올려주세요.</span></p>
    <button class="btn btn--primary btn--lg btn--block" type="button" id="calc-go">이 견적으로 상담 신청</button>
    <p class="calc__note">인프케어 공개 가격표 기준 금액입니다. 오염 정도 · 소재 · 현장 여건에 따라 달라질 수 있으며, 최종 금액은 방문 전 안내드립니다.</p>
  </aside>
</div>
